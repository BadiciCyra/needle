services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: needle
      POSTGRES_DB: needle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  omniroute:
    profiles: ["omniroute"]
    image: diegosouzapw/omniroute
    environment:
      DATA_DIR: /app/data
      PORT: 20128
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://needle:needle@db:5432/needle
    command: sh -c "python -m seed.seed_db --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/demo_cache:/app/demo_cache
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  omniroute-data:
  hf-cache:
