# Needle yerel geliştirme ortamı
#
# Kullanım:
#   1. cp .env.example .env  ve  LLM_API_KEY'e Gemini anahtarını yaz (https://aistudio.google.com/apikey)
#   2. docker compose up -d --build        → arayüz http://localhost:3000, API http://localhost:8000/docs
#      (API ilk açılışta girişim tablosu boşsa STARTUPS_FILE'daki girişimleri yükler)
#
# Servisler:
#   db         5432   Postgres 16 + pgvector
#   omniroute  20128  İsteğe bağlı çoklu sağlayıcı LLM geçidi (--profile omniroute ile açılır)
#   api        8000   Needle FastAPI backend
#   web        3000   Needle arayüzü (React, nginx; /api → api)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: needle
      POSTGRES_DB: needle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  omniroute:
    profiles: ["omniroute"]  # varsayılan olarak kapalı; LLM doğrudan sağlayıcıya bağlanır
    image: diegosouzapw/omniroute
    environment:
      DATA_DIR: /app/data
      PORT: 20128
    ports:
      # Sadece loopback: içinde sağlayıcı anahtarları durduğu için dışarıya açılmaz
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://needle:needle@db:5432/needle
    command: sh -c "python -m seed.seed_db --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # 8000 başka bir uygulamadaysa: API_PORT=8010
    volumes:
      - ./backend/demo_cache:/app/demo_cache
      # embedding / reranker modelleri her yeniden kurulumda tekrar inmesin
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  omniroute-data:
  hf-cache:
