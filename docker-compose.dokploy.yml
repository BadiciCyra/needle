services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD Environment sekmesinde tanımlanmalı}
      POSTGRES_DB: needle
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://needle:${POSTGRES_PASSWORD}@db:5432/needle
    command: sh -c "python -m seed.seed_db --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  hf-cache:
