# Needle — Dokploy (ya da herhangi bir sunucu) için yayın compose dosyası
#
# Yerel geliştirmedeki docker-compose.yml'den farkları:
#   - Hiçbir port sunucuya açılmaz. Dışarıya yalnızca "web" çıkar; Dokploy'un Domains sekmesinden
#     web servisine, 80 numaralı porta domain bağlanır (Traefik + Let's Encrypt).
#   - Veritabanı şifresi ve bütün ayarlar Dokploy'un Environment sekmesinden gelir (.env olarak yazılır).
#   - Veriler adlandırılmış volume'larda durur, yeniden deploy'da silinmez.
#
# Environment sekmesine en az şunlar yazılır (bkz. docs/dokploy-kurulum.md):
#   POSTGRES_PASSWORD=<uzun rastgele şifre>
#   LLM_API_KEY=<Gemini anahtarı>
#   APP_BASE_URL=https://<domain>
#   COOKIE_SECURE=true          (domain HTTPS ise; düz http ile deniyorsan false)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD Environment sekmesinde tanımlanmalı}
      POSTGRES_DB: needle
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://needle:${POSTGRES_PASSWORD}@db:5432/needle
    # Girişim tablosu boşsa 282 girişimi embedding'leriyle yükler (ilk açılışta birkaç dakika sürer)
    command: sh -c "python -m seed.seed_db --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    volumes:
      # Embedding modeli (~470 MB) her deploy'da yeniden inmesin
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  hf-cache:
