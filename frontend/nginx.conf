server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Temel güvenlik başlıkları: başka sitede çerçeve içine alınma (clickjacking), MIME tahmini, yönlendiren sızıntısı
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # /api/... → FastAPI (önek atılır)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # Giriş denemesi sınırı IP'yi buradan okur; istemcinin gönderdiği değer ezilir
        proxy_set_header X-Real-IP $remote_addr;
        # brief ve eşleştirme LLM çağrısı içerir, bir dakikayı aşabilir
        proxy_read_timeout 300s;
    }

    # /api/docs sayfası şemayı kökten ister
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # Tek sayfa uygulama: bilinmeyen yollar index.html'e düşer
    location / {
        try_files $uri /index.html;
    }
}
